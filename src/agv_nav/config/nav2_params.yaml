# Nav2 参数：Ackermann 小车（轴距 0.855 m，内侧轮最大转角 30° -> 中心等效转角 0.414 rad，后轴中心最小转弯半径理论 1.94 m、
# 实测满舵约 2.19 m（内侧轮顶到关节限位打不满）；base_link 在车身中心、后轴前 0.432 m，它的转弯半径 = hypot(后轴半径, 0.432)。
# MPPI 的 min_turning_r 是后轴半径（vx / wz），取 2.2；规划器 / 平滑器按 base_link 路径点，取 hypot(2.2, 0.432) 再留余量 = 2.3。
# 原来三处都是 1.95：终点前的倒车弧线按 1.95 规划，车转不过来，到终点侧偏、朝向差，只能前后反复挪；
# 车体 1.2 x 1.08 m（2026-10-10 整车放大 1.5 倍）。膨胀半径 1.4 m、衰减系数 2.0：让路径离货架端头等拐角远一些，大车跟踪时切弯也不至于蹭进去）
# 全局规划 Smac Hybrid-A*，局部控制 MPPI（Ackermann 运动模型），定位由 Cartographer 提供 map->odom

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # Cartographer 的 map->odom 只在每帧点云处理完后发布（约 8 Hz），容差要大于其间隔
    transform_tolerance: 0.5
    # 由 navigation.launch.py 用 RewrittenYaml 填成 agv_nav 的 navigate_to_pose_ackermann.xml 绝对路径
    # （RewrittenYaml 只替换已存在的键，所以这里必须留占位）
    default_nav_to_pose_bt_xml: ""
    # 每个新目标都重新加载行为树：GlobalUpdatedGoal / PathExpiringTimer 的状态清零，
    # 同一个目标重发（任务重试）时也会先重规划，不沿用上一次留在黑板上的旧路径
    always_reload_bt_xml: true
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  # 距离类参数（终点容差、各 critic 的 threshold_to_consider、prune_distance、预测时长等）在 2026-10-11 随车放大 1.5 倍
  ros__parameters:
    use_sim_time: True
    # MPPI 在本机 20 Hz 算不完（大量 missed rate），10 Hz 对 0.5 m/s 的车足够
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.45
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.375
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 2.2               # 后轴半径，见文件开头
      time_steps: 45
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.5
      wz_max: 0.8
      temperature: 0.3
      gamma: 0.015
      prune_distance: 2.5
      transform_tolerance: 0.5
      reset_period: 1.0
      regenerate_noises: false
      # Hybrid-A*（Reeds-Shepp）的路径里会有前进/倒车切换点，让 MPPI 先走到切换点再换向
      enforce_path_inversion: true
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # 不用 PreferForwardCritic：它对所有倒车速度都罚分，路径要求倒车时和路径类 critic 打架，
      # MPPI 每帧在前进 / 倒车间翻转，车原地前后挪。前进还是倒车只听路径（Smac reverse_penalty 已偏向前进）
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.1
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.75
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.75
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 2.1
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.75
        max_angle_to_furthest: 1.0
        # 允许按路径方向倒车
        forward_preference: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      # 车体轮廓外扩 5 cm 的余量（与全局代价地图一致），MPPI 不会贴着障碍走
      footprint_padding: 0.05
      # 静态层读连续代价（0..100），坡道代价能传给规划器；不设则被压成空闲/占用/未知三档
      trinary_costmap: false
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05
      footprint: "[[0.60, 0.54], [0.60, -0.54], [-0.60, -0.54], [-0.60, 0.54]]"
      # 雷达前倾，车后方低处是盲区；而且朝后上方打到高处墙面的光束在 2D 里会把中间矮障碍的标记清掉，
      # 倒车时 MPPI 看不到身后已知的障碍。加静态层，地图里的障碍始终在局部代价地图里
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # 语义地图的禁行过滤器：只有 navigation.launch.py 给了 semantic 时才加进 filters 列表
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: /keepout_filter_info
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: terrain terrain_ground terrain_rear terrain_ground_rear
        terrain:
          # terrain_obstacle_filter 已按地面高程过滤过，这里不再按高度过滤（坡上、平台上障碍的 z 不固定）
          topic: /terrain_obstacles
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: True
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        # 只发障碍点时，射线只沿指向障碍点的方向清除，人走开后留下“幽灵障碍”。地面点只用来清除
        terrain_ground:
          topic: /terrain_ground
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: False
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
        terrain_rear:
          topic: /terrain_obstacles_rear
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: True
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        terrain_ground_rear:
          topic: /terrain_ground_rear
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: False
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 1.4
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      # Hybrid-A* 只把轮廓压到致命格算碰撞，否则会在墙边安排离墙仅 4~6 cm 的掉头换向点，
      # 控制器冲过换向点就贴墙。按外扩 5 cm 的轮廓规划，与局部代价地图一致
      footprint_padding: 0.05
      # 静态层读连续代价（0..100），坡道代价能传给规划器；不设则被压成空闲/占用/未知三档
      trinary_costmap: false
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.60, 0.54], [0.60, -0.54], [-0.60, -0.54], [-0.60, 0.54]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # 语义地图的禁行 / 限速过滤器：只有 navigation.launch.py 给了 semantic 时才加进 filters 列表
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: /keepout_filter_info
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: /speed_filter_info
        speed_limit_topic: /speed_limit
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: terrain terrain_ground terrain_rear terrain_ground_rear
        terrain:
          # terrain_obstacle_filter 已按地面高程过滤过，这里不再按高度过滤（坡上、平台上障碍的 z 不固定）
          topic: /terrain_obstacles
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: True
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        # 只发障碍点时，射线只沿指向障碍点的方向清除，人走开后留下“幽灵障碍”。地面点只用来清除
        terrain_ground:
          topic: /terrain_ground
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: False
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
        terrain_rear:
          topic: /terrain_obstacles_rear
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: True
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        terrain_ground_rear:
          topic: /terrain_ground_rear
          data_type: "PointCloud2"
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          clearing: True
          marking: False
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 1.4
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 3000000
      max_on_approach_iterations: 1000
      max_planning_time: 10.0
      # 允许倒车；房间小、转弯半径 2 m 以上，只能前进的话很多目标到不了
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 2.3       # base_link 半径，见文件开头
      reverse_penalty: 5.0              # 车放大后在窄处倒车容易蹭进货架膨胀区，优先前进
      # 换向本身不计代价、倒车又贵时，掉头会拆成"倒 0.2 前 0.6 倒 0.2…"一串碎段（HOME 掉头 9 个换向点）。
      # change_penalty 罚的是运动方向（前直/前左/前右/倒直/倒左/倒右）变化时的转弯段，前左→倒右这种换向也算；
      # 实测仓库 8 个倒车目标合计换向点：取 0 时 31 个，取 3 时 15 个，总长多约 10%
      change_penalty: 3.0
      non_straight_penalty: 1.2
      cost_penalty: 3.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: True
    transform_tolerance: 0.5
    # 约束平滑器：在 Smac 自带平滑之后再优化一遍，满足最小转弯半径、远离障碍，保留倒车换向点
    smoother_plugins: ["constrained_smoother"]
    constrained_smoother:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: true
      path_downsampling_factor: 3       # 0.05 m 栅格路径 -> 0.15 m 间隔再优化
      path_upsampling_factor: 1         # 优化后插值回原来的点密度
      keep_start_orientation: true
      keep_goal_orientation: true
      minimum_turning_radius: 2.3       # 与规划器一致
      w_curve: 30.0
      w_dist: 0.0
      w_smooth: 2000000.0
      w_cost: 0.015
      w_cost_cusp_multiplier: 3.0
      cusp_zone_length: 2.5
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 5.0e3
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    # Ackermann 下 vx 和 wz 必须按同一比例限幅，否则曲率被改变
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.8]
    min_velocity: [-0.3, 0.0, -0.8]
    # 0.5 m/s 的车：0 -> 最高速 1 s，最高速刹停约 0.25 m；前轮转角速率另由 cmd_vel_to_ackermann 限制
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
